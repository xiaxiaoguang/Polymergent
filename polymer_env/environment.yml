name: polymer
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- 层 0 ---
  - python=3.11
  - pip
  - setuptools<81  # 新增：setuptools>=81 删除了 pkg_resources，mbuild/foyer/gmso 仍在 import 它
  - git            # 新增：pip 装 GitHub 仓库（pysimm / RadonPy）需要

  # --- 层 1–4：数值底座，禁止再走 pip ---
  - numpy=1.26.*
  - scipy=1.14.*
  - pandas
  - matplotlib
  - seaborn
  - statsmodels
  - scikit-learn
  - networkx
  - pyyaml
  - requests
  - tqdm
  - lxml
  - beautifulsoup4
  - jupyter
  - notebook
  - ipykernel
  - ipywidgets
  - pytest

  # --- 层 2–3：化学 / MD / QC / CLI（同一趟 solve）---
  - rdkit
  - openbabel
  - openmm
  - parmed
  - mdanalysis
  - mdtraj
  - ase
  - xtb
  - xtb-python
  - packmol
  - lammps
  - mbuild
  - foyer
  - gmso
  - pymatgen
  - pyscf
  - nglview
  # 需要 packmol-memgen 再打开下一行
  - ambertools     # 同时提供 CLI: antechamber / parmchk2 / tleap

  # --- 新增（conda-forge）：力场 / 输出解析 / 单位 / MD 引擎 ---
  - openff-toolkit          # SMIRNOFF 力场 (Sage)，单体/小分子
  - openff-interchange      # OpenFF 体系 -> LAMMPS/GROMACS/OpenMM
  - openff-forcefields      # Sage 力场文件
  - openmmforcefields       # GAFF / OpenFF 参数生成给 OpenMM
  - cclib                   # 解析 QM 输出日志
  - pint                    # 单位，避免 MD 单位错误
  - gromacs                 # CLI: gmx（配合 polyply / Martini）

  # --- 新增（可选，体积大 / 容易和上面冲突；确认主环境能 solve 后再打开）---
  # - psi4                  # QM 引擎；RadonPy 依赖它

  - pip:
      # --- LLM / agent：不要写 numpy/scipy/pandas ---
      - langchain
      - langgraph==0.3.18
      - langchain-openai
      - langchain-anthropic
      - langchain-ollama
      - langchain-community
      - openai
      - transformers
      - sentencepiece
      - mcp
      - tooluniverse
      - python-dotenv
      - gradio

      # --- 化学纯 Python ---
      - pubchempy
      - cirpy
      - mordredcommunity        # 维护中的 mordred 分支，import 名仍是 mordred
      - stk
      - thermo
      - chemicals
      - CoolProp
      - py3Dmol

      # --- 新增：聚合物专用 / ML（PyPI）---
      - polyply                 # GROMACS 聚合物拓扑 + 坐标 (CLI: polyply)
      - pysoftk                 # 聚合物库自动生成
      - psmiles                 # PSMILES 规范化；polyBERT 指纹需 psmiles[polybert]
      - chemprop                # D-MPNN 性质预测（会拉 torch，体积大）

      # --- 新增（可选，GitHub 安装，非 PyPI 稳定发布；需要时取消注释）---
      # - git+https://github.com/polysimtools/pysimm     # 需要 lammps
      # - git+https://github.com/RadonPy/RadonPy         # 需要 psi4 + lammps python 模块
      # - polyid                                          # TensorFlow 旧栈，容易冲突